name: Daily Market Brief

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      mode:
        description: "Report mode"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - us
          - cn
          - cn_midday_close
          - cn_pm_preopen

permissions:
  contents: write

concurrency:
  group: daily-market-brief-commit
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate report
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: |
          MODE="${{ inputs.mode || 'full' }}"
          python -m src.main --mode "$MODE"

      - name: Commit generated report
        continue-on-error: true
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Add daily market brief"
          file_pattern: reports/*.md
